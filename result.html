<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 월드컵 조 예측 결과</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Poppins:wght@400;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy:    #07142b;
      --gold:    #f0c040;
      --white:   #f5f5f0;
      --muted:   #8ba09a;
      --card:    #0e2a3a;
      --p0: #FF5252;  --p1: #00BCD4;  --p2: #FFD54F;
      --p3: #AB47BC;  --p4: #F06292;  --p5: #26C6DA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--navy); color: var(--white); font-family: 'Poppins', sans-serif; min-height: 100vh; }
    header { background: linear-gradient(160deg, #0a3d1f 0%, var(--navy) 65%); border-bottom: 2px solid var(--gold); padding: 40px 20px; text-align: center; }
    h1 { font-family: 'Outfit', sans-serif; font-size: 2.5rem; font-weight: 700; }
    h1 span { color: var(--gold); }

    /* 상태 표시바 */
    .status-bar { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 20px; background: rgba(0,0,0,0.3); font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; color: var(--muted); border-bottom: 1px solid rgba(255,255,255,0.06); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; transition: background 0.3s; }
    .status-dot.live { background: #4ade80; box-shadow: 0 0 6px #4ade80; animation: pulse 1.5s infinite; }
    .status-dot.ok   { background: #4ade80; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    main { max-width: 1100px; margin: 40px auto; padding: 0 20px 80px; }
    .section-title { font-family: 'Outfit', sans-serif; font-size: 1.8rem; font-weight: 700; margin: 30px 0 20px; }
    
    .tab-nav { display: flex; gap: 4px; margin-bottom: 20px; background: var(--card); border: 1px solid rgba(240,192,64,0.18); border-radius: 12px; padding: 6px; }
    .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; font-size: 0.9rem; font-weight: 600; }
    .tab-btn.active { background: var(--gold); color: #000; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .group-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
    .group-card { background: var(--card); border: 1px solid rgba(240,192,64,0.18); border-radius: 12px; overflow: hidden; }
    .group-header { padding: 14px 18px; background: rgba(240,192,64,0.12); border-bottom: 1px solid rgba(240,192,64,0.18); cursor: pointer; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .group-label { font-family: 'Outfit', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--gold); }
    .group-teams { font-size: 0.75rem; color: var(--muted); flex: 1; }
    .group-pickers { display: flex; gap: 6px; flex-wrap: wrap; }
    .picker-badge { font-size: 0.7rem; font-family: 'IBM Plex Mono', monospace; color: var(--white); padding: 4px 12px; border-radius: 14px; font-weight: 700; }
    .picker-badge.p0 { background: var(--p0); } .picker-badge.p1 { background: var(--p1); } .picker-badge.p2 { background: var(--p2); }
    .picker-badge.p3 { background: var(--p3); } .picker-badge.p4 { background: var(--p4); } .picker-badge.p5 { background: var(--p5); }

    .group-matches { display: none; padding: 18px; background: linear-gradient(135deg, rgba(10,61,31,0.15), rgba(14,42,58,0.2)); }
    .group-card.open .group-matches { display: block; }

    .standings-wrapper { margin-bottom: 18px; border: 1px solid rgba(240,192,64,0.2); border-radius: 10px; overflow: hidden; background: rgba(240,192,64,0.06); }
    .standings-title { padding: 12px 16px; background: rgba(240,192,64,0.18); font-family: 'Outfit', sans-serif; font-size: 0.95rem; font-weight: 700; color: var(--gold); }
    .standings-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    .standings-table th { font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; padding: 10px 6px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.08); color: var(--muted); font-weight: 500; white-space: nowrap; }
    .standings-table th:first-child { text-align: left; padding-left: 16px; }
    .standings-table td { padding: 8px 6px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .standings-table td:first-child { text-align: left; padding-left: 16px; font-weight: 600; }
    .standings-table tbody tr:nth-child(1) td, .standings-table tbody tr:nth-child(2) td { color: var(--gold); }

    .matches-label { font-size: 0.75rem; color: var(--gold); font-family: 'Outfit', sans-serif; font-weight: 700; text-transform: uppercase; margin: 10px 0; display: block; }
    .matches-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .match-group { display: flex; flex-direction: column; gap: 8px; }
    .match-single { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 10px; }
    .match-single:hover { background: rgba(255,255,255,0.1); border-color: rgba(240,192,64,0.3); }
    .match-date-time { font-family: 'IBM Plex Mono', monospace; font-size: 0.68rem; color: var(--gold); margin-bottom: 6px; font-weight: 700; }
    .match-teams { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 0.8rem; font-weight: 600; }
    .team-name-sm { flex: 1; }
    .team-name-sm.home { text-align: right; }
    .team-name-sm.away { text-align: left; }
    .score-box { font-family: 'Outfit', sans-serif; font-size: 0.9rem; color: var(--gold); background: rgba(240,192,64,0.2); border: 1px solid rgba(240,192,64,0.4); border-radius: 6px; padding: 3px 8px; min-width: 44px; font-weight: 700; text-align: center; }
    .score-box.live { color: #4ade80; background: rgba(74,222,128,0.15); border-color: rgba(74,222,128,0.4); animation: pulse 1.5s infinite; }

    .rules-box { background: linear-gradient(135deg, rgba(15,92,46,0.3), rgba(7,20,43,0.6)); border: 1px solid rgba(240,192,64,0.3); border-radius: 12px; padding: 18px; margin: 20px 0; font-size: 0.88rem; line-height: 1.7; }
    .rules-box strong { color: var(--gold); }

    /* 참가자 카드 */
    .participants-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin: 20px 0; }
    .participant-card { background: var(--card); border: 2px solid rgba(240,192,64,0.18); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
    .participant-header { display: flex; align-items: center; justify-content: space-between; }
    .participant-name { font-family: 'Outfit', sans-serif; font-size: 1.2rem; font-weight: 700; }
    .participant-alive-count { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--muted); }
    .participant-alive-count span { color: #4ade80; font-weight: 700; }
    .participant-score { font-family: 'IBM Plex Mono', monospace; font-size: 0.82rem; font-weight: 700; color: var(--gold); background: rgba(240,192,64,0.12); border: 1px solid rgba(240,192,64,0.3); border-radius: 6px; padding: 1px 8px; margin-left: 10px; vertical-align: middle; }
    .ko-stage { margin-bottom: 28px; }
    .ko-stage-title { font-family: 'Outfit', sans-serif; font-size: 1rem; font-weight: 700; color: var(--gold); letter-spacing: 0.06em; padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 12px; cursor: pointer; user-select: none; display: flex; align-items: center; justify-content: space-between; }
    .ko-stage-title:hover { color: #ffe066; }
    .ko-toggle { font-size: 0.65rem; color: var(--muted); transition: transform 0.2s; }
    .ko-stage.collapsed .ko-toggle { transform: rotate(180deg); }
    .ko-stage.collapsed .ko-matches-grid { display: none; }
    .ko-matches-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 640px) { .ko-matches-grid { grid-template-columns: 1fr; } }

    /* 조별 팀 목록 */
    .participant-group-section { display: flex; flex-direction: column; gap: 6px; }
    .participant-group-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--gold); font-weight: 700; letter-spacing: 0.08em; margin-bottom: 2px; }
    .team-chips { display: flex; flex-wrap: wrap; gap: 6px; }

    /* 팀 칩 */
    .team-chip { font-size: 0.75rem; font-family: 'Poppins', sans-serif; font-weight: 600; padding: 5px 12px; border-radius: 20px; border: 1px solid; transition: all 0.3s; white-space: nowrap; }
    /* 생존 */
    .team-chip.alive { background: rgba(74,222,128,0.1); border-color: rgba(74,222,128,0.4); color: #4ade80; }
    /* 아직 결정 안됨 (조별리그 전) */
    .team-chip.pending { background: rgba(240,192,64,0.08); border-color: rgba(240,192,64,0.25); color: var(--white); }
    /* 탈락 */
    .team-chip.eliminated { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.08); color: rgba(255,255,255,0.25); text-decoration: line-through; }

    footer { text-align: center; padding: 24px; font-size: 0.75rem; color: var(--muted); border-top: 1px solid rgba(255,255,255,0.07); }
    @media (max-width: 640px) { .matches-grid { grid-template-columns: 1fr; } }

    /* 초기화 모달 */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: var(--card); border: 2px solid var(--gold); border-radius: 16px; padding: 32px 28px; width: 320px; text-align: center; }
    .modal-title { font-family: 'Outfit', sans-serif; font-size: 1.2rem; font-weight: 700; color: var(--gold); margin-bottom: 8px; }
    .modal-desc { font-size: 0.82rem; color: var(--muted); margin-bottom: 20px; }
    .modal-input { width: 100%; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; padding: 10px 14px; color: var(--white); font-size: 1.1rem; letter-spacing: 0.2em; text-align: center; outline: none; font-family: 'IBM Plex Mono', monospace; }
    .modal-input:focus { border-color: var(--gold); }
    .modal-input.error { border-color: #FF5252; animation: shake .3s; }
    .modal-error { color: #FF5252; font-size: 0.78rem; margin-top: 8px; min-height: 18px; font-family: 'IBM Plex Mono', monospace; }
    .modal-btns { display: flex; gap: 10px; margin-top: 20px; }
    .modal-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-family: 'Outfit', sans-serif; font-size: 0.95rem; font-weight: 700; cursor: pointer; }
    .modal-btn.confirm { background: #FF5252; color: #fff; }
    .modal-btn.confirm:hover { opacity: .85; }
    .modal-btn.cancel { background: transparent; color: var(--muted); border: 1px solid rgba(255,255,255,0.15); }
    .modal-btn.cancel:hover { border-color: var(--muted); }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  </style>
</head>
<body>
  <header>
    <h1>2026 FIFA 월드컵<br/><span>일정 & 조 예측 게임</span></h1>
    <div style="margin-top:16px;display:flex;align-items:center;justify-content:center;gap:20px;">

      <button onclick="openResetModal()" style="font-family:'IBM Plex Mono',monospace;font-size:0.78rem;background:transparent;border:1px solid rgba(255,82,82,0.4);color:#FF5252;border-radius:8px;padding:5px 14px;cursor:pointer;opacity:.7;">초기화</button>
    </div>
  </header>
  <div class="status-bar">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">초기화 중…</span>
  </div>

  <main>
    <section>
      <h2 class="section-title">📅 경기 일정 & 결과</h2>

      </div>
      <div id="stage0" class="tab-panel active">
        <div class="group-grid" id="group-grid"></div>

      <div id="stage1" class="tab-panel"><div id="tournament-bracket"></div></div>

    <section>

      <div class="rules-box"><strong>📋 게임 규칙:</strong> 4명이 각각 3개 조를 선택. 우승 국가가 속한 조를 맞힌 사람이 승리!</div>
      <div class="participants-grid" id="participants-grid"></div>
    </section>
  </main>

  <!-- 초기화 모달 -->
  <div class="modal-overlay" id="reset-modal" onclick="handleOverlayClick(event)">
    <div class="modal-box">
      <div class="modal-title">드래프트 초기화</div>
      <div class="modal-desc">초기화하면 모든 드래프트 결과가 삭제됩니다.<br/>비밀번호를 입력하세요.</div>
      <input class="modal-input" id="reset-pw" type="password" maxlength="10" placeholder="••••" onkeydown="handlePwKey(event)"/>
      <div class="modal-error" id="reset-error"></div>
      <div class="modal-btns">
        <button class="modal-btn cancel" onclick="closeResetModal()">취소</button>
        <button class="modal-btn confirm" onclick="confirmReset()">초기화</button>
      </div>
    </div>
  </div>

  <footer>2026 FIFA 월드컵 · 조 예측 게임 · 친구들과 함께 ⚽</footer>

      const d = new Date(new Date(utcDate).getTime() + 9 * 3600 * 1000);
      const days = ['일','월','화','수','목','금','토'];
      const M  = d.getUTCMonth() + 1;
      const D  = d.getUTCDate();
      const dw = days[d.getUTCDay()];
      const H  = String(d.getUTCHours()).padStart(2,'0');
      const mi = String(d.getUTCMinutes()).padStart(2,'0');
      return `${M}/${D}(${dw}) ${H}:${mi}`;
    }

    const STAGE_LABELS = {
      LAST_32: '⚔️ 32강', LAST_16: '⚔️ 16강', QUARTER_FINALS: '⚔️ 8강',
      SEMI_FINALS: '⚔️ 4강', THIRD_PLACE: '🥉 3·4위전', FINAL: '🏆 결승',
    };

    let autoSwitchedToTournament = false;
    let groupTeamMap = {};   // { 'A_1': '멕시코', ... }
    let top8Third    = [];   // 3위 중 진출 상위 8팀 [{ group, name }, ...]

    function buildGroupTeamMap(standingsData) {
      groupTeamMap = {};
      const thirdPlacers = [];
      (standingsData.standings || []).forEach(gs => {
        const letter = gs.group?.replace('Group ', '');
        (gs.table || []).forEach((row, i) => {
          groupTeamMap[`${letter}_${i + 1}`] = toKo(row.team);
        });
        if (gs.table?.[2]) {
          thirdPlacers.push({
            group: letter,
            name: toKo(gs.table[2].team),
            points: gs.table[2].points,
            gd: gs.table[2].goalDifference,
            gf: gs.table[2].goalsFor,
          });
        }
      });
      thirdPlacers.sort((a, b) => b.points - a.points || b.gd - a.gd || b.gf - a.gf);
      top8Third = thirdPlacers.slice(0, 8);
    }

    function getPickersForTeam(teamName) {
      if (!teamName || teamName === '미정') return [];
      const group = GROUPS.find(g => g.teams.includes(teamName));
      if (!group) return [];
      return PARTICIPANTS
        .map((p, i) => ({ name: p.name, ci: p.colorIdx ?? i, groups: p.groups }))
        .filter(p => p.groups.includes(group.id));
    }

    function resolveLabel(label) {
      // "A조 2위" → 실제 팀명
      const simple = label.match(/^([A-L])조 (\d)위$/);
      if (simple) return groupTeamMap[`${simple[1]}_${simple[2]}`] || label;

      // "3위(A·B·C·D·F)" → 해당 조 출신 3위 중 진출 팀
      const third = label.match(/^3위\(([A-L·]+)\)$/);
      if (third) {
        const groups = third[1].split('·');
        const team = top8Third.find(t => groups.includes(t.group));
        return team ? team.name : label;
      }
      return label;
    }

    function renderTournament(allMatches) {
      const koMatches = allMatches.filter(m => m.stage !== 'GROUP_STAGE');
      const stages = ['LAST_32','LAST_16','QUARTER_FINALS','SEMI_FINALS','THIRD_PLACE','FINAL'];

      const pickerBadges = (teamName, side = 'right') =>
        getPickersForTeam(teamName)
          .map(p => `<span class="picker-badge p${p.ci}" style="font-size:0.6rem;padding:2px 7px;${side==='left'?'margin-right':'margin-left'}:4px;vertical-align:middle;">${p.name}</span>`)
          .join('');

      const card = (home, away, scoreHtml, dateStr) => `
        <div class="match-single">
          ${dateStr ? `<div class="match-date-time">${dateStr} KST</div>` : ''}
          <div class="match-teams">
            <span class="team-name-sm home">${pickerBadges(home,'left')}${home}</span>
            ${scoreHtml}
            <span class="team-name-sm away">${away}${pickerBadges(away,'right')}</span>
          </div>
        </div>`;

      const titleHtml = (stage, collapsed) =>
        `<div class="ko-stage-title" onclick="this.closest('.ko-stage').classList.toggle('collapsed')">
          ${STAGE_LABELS[stage]}<span class="ko-toggle">▲</span>
        </div>`;

      // API 데이터 없으면 정적 스케줄로 표시
      if (!koMatches.length) {
        const html = stages.map(stage => {
          const ms = KNOCKOUT_SCHEDULE.filter(m => m.round === stage);
          if (!ms.length) return '';
          const cards = ms.map(m => card(
            resolveLabel(m.s1), resolveLabel(m.s2),
            '<span class="score-box">-</span>', m.date
          )).join('');
          return `<div class="ko-stage">${titleHtml(stage)}<div class="ko-matches-grid">${cards}</div></div>`;
        }).join('');
        document.getElementById('tournament-bracket').innerHTML = html;
        return;
      }

      // 단계별 경기 날짜순 정렬
      const byStage = {};
      stages.forEach(s => {
        byStage[s] = koMatches.filter(m => m.stage === s)
          .sort((a, b) => new Date(a.utcDate) - new Date(b.utcDate));
      });

      // 스코어 HTML 생성 (승부차기 경기는 fullTime에 PK골 포함돼 있으므로 regularTime+extraTime 사용)
      function scoreHtml(m) {
        if (!m) return '<span class="score-box">-</span>';
        const s = m.status;
        if (s === 'FINISHED') {
          const isPK = m.score?.duration === 'PENALTY_SHOOTOUT';
          let h, a;
          if (isPK) {
            const rt = m.score.regularTime, et = m.score.extraTime;
            h = (rt?.home ?? 0) + (et?.home ?? 0);
            a = (rt?.away ?? 0) + (et?.away ?? 0);
          } else {
            h = m.score?.fullTime?.home;
            a = m.score?.fullTime?.away;
          }
          const pen = m.score?.penalties;
          return `<span class="score-box">${h} - ${a}</span>` +
            (pen ? `<span style="font-size:0.7rem;color:var(--muted)"> (PK ${pen.home}:${pen.away})</span>` : '');
        }
        if (s === 'IN_PLAY' || s === 'PAUSED') {
          const ch = m.score?.currentPeriod?.home ?? '?';
          const ca = m.score?.currentPeriod?.away ?? '?';
          return `<span class="score-box live">${ch} - ${ca} 🔴</span>`;
        }
        return '<span class="score-box">-</span>';
      }

      // 승자/패자 계산 (팀명 문자열 기반)
      function winner(m, h, a) {
        if (!m || m.status !== 'FINISHED') return null;
        const hs = m.score?.fullTime?.home ?? 0, as = m.score?.fullTime?.away ?? 0;
        if (hs > as) return h;
        if (as > hs) return a;
        const pen = m.score?.penalties;
        if (pen) return pen.home > pen.away ? h : a;
        return null;
      }
      function loser(m, h, a) {
        const w = winner(m, h, a);
        return w ? (w === h ? a : h) : null;
      }

      // match id → { home, away } 팀명 맵
      const teams = {};

      // LAST_32: API 팀명 or 순위표 기반 resolveLabel
      byStage['LAST_32'].forEach((m, i) => {
        const ks = KNOCKOUT_SCHEDULE.filter(k => k.round === 'LAST_32')[i] || {};
        teams[m.id] = {
          home: toKo(m.homeTeam) || resolveLabel(ks.s1 || '') || '미정',
          away: toKo(m.awayTeam) || resolveLabel(ks.s2 || '') || '미정',
        };
      });

      // LAST_16, QF, SF: 이전 라운드 승자 쌍으로 계산
      function computeFromPrev(stage, prevStage) {
        const prev = byStage[prevStage];
        byStage[stage].forEach((m, i) => {
          const p1 = prev[i * 2], p2 = prev[i * 2 + 1];
          const t1 = p1 ? teams[p1.id] : null;
          const t2 = p2 ? teams[p2.id] : null;
          teams[m.id] = {
            home: toKo(m.homeTeam) || (t1 ? winner(p1, t1.home, t1.away) : null) || '미정',
            away: toKo(m.awayTeam) || (t2 ? winner(p2, t2.home, t2.away) : null) || '미정',
          };
        });
      }
      computeFromPrev('LAST_16',        'LAST_32');
      computeFromPrev('QUARTER_FINALS', 'LAST_16');
      computeFromPrev('SEMI_FINALS',    'QUARTER_FINALS');

      // 결승 / 3·4위전: SF 승자·패자
      const sf = byStage['SEMI_FINALS'];
      const sf1 = sf[0], sf2 = sf[1];
      const t1 = sf1 ? teams[sf1.id] : null, t2 = sf2 ? teams[sf2.id] : null;
      byStage['FINAL'].forEach(m => {
        teams[m.id] = {
          home: toKo(m.homeTeam) || (t1 ? winner(sf1, t1.home, t1.away) : null) || '미정',
          away: toKo(m.awayTeam) || (t2 ? winner(sf2, t2.home, t2.away) : null) || '미정',
        };
      });
      byStage['THIRD_PLACE'].forEach(m => {
        teams[m.id] = {
          home: toKo(m.homeTeam) || (t1 ? loser(sf1, t1.home, t1.away) : null) || '미정',
          away: toKo(m.awayTeam) || (t2 ? loser(sf2, t2.home, t2.away) : null) || '미정',
        };
      });

      // 자동 접기: 모든 경기가 FINISHED인 단계는 접힘, 첫 번째 진행 중/예정 단계는 펼침
      const stagesWithMatches = stages.filter(s => byStage[s]?.length);
      const allDone = s => byStage[s]?.length > 0 && byStage[s].every(m => m.status === 'FINISHED');
      let activeStage = stagesWithMatches.find(s => !allDone(s));
      if (!activeStage) activeStage = stagesWithMatches[stagesWithMatches.length - 1];
      const activeIdx = stagesWithMatches.indexOf(activeStage);

      // 렌더링
      const html = stages.map(stage => {
        const ms = byStage[stage];
        if (!ms?.length) return '';
        const stageIdx = stagesWithMatches.indexOf(stage);
        const collapsed = stageIdx < activeIdx ? 'collapsed' : '';
        const cards = ms.map(m => {
          const t = teams[m.id] || { home: '미정', away: '미정' };
          return card(t.home, t.away, scoreHtml(m), fmtKST(m.utcDate));
        }).join('');
        return `<div class="ko-stage ${collapsed}">${titleHtml(stage)}<div class="ko-matches-grid">${cards}</div></div>`;
      }).join('');

      document.getElementById('tournament-bracket').innerHTML = html;

      if (!autoSwitchedToTournament && koMatches.length > 0) {
        switchTab(1);
        autoSwitchedToTournament = true;
      }
    }

    const COLOR_HEX = ['#FF5252','#00BCD4','#FFD54F','#AB47BC'];

    let PARTICIPANTS = [];

    function getPickersByGroup(id) {
      return PARTICIPANTS.filter(p=>p.groups.includes(id)).map(p=>p.name);
    }

    function switchTab(n) {
      document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.getElementById('stage'+n).classList.add('active');
      document.querySelectorAll('.tab-btn')[n].classList.add('active');
    }

    function toggleGroup(id) {
      const card = document.getElementById('gc-'+id);
      if(card) card.classList.toggle('open');
    }

    let refreshTimer = null;

    /* ================================================================
       시간 유틸
    ================================================================ */
    function hasMatchToday(matches) {
      const today = new Date().toDateString();
      return matches.some(m => new Date(m.utcDate).toDateString() === today);
    }

    function hasLiveMatch(matches) {
      return matches.some(m => m.status === 'IN_PLAY' || m.status === 'PAUSED');
    }

    function getRefreshInterval(matches) {
      if (hasLiveMatch(matches))   return 60 * 1000;
      if (hasMatchToday(matches))  return 5 * 60 * 1000;
      return 60 * 60 * 1000;
    }

    function setStatusBar(state, text) {
      const dot  = document.getElementById('status-dot');
      const span = document.getElementById('status-text');
      if (!dot || !span) return;
      dot.className  = 'status-dot' + (state === 'live' ? ' live' : state === 'ok' ? ' ok' : '');
      span.textContent = text;
    }

    /* ================================================================
       데이터 로드 (GitHub Actions가 생성한 api-data.json 사용)
    ================================================================ */
    async function fetchFromAPI() {
      const res = await fetch('api-data.json?_=' + Date.now());
      if (!res.ok) throw new Error(`api-data.json 로드 실패 (${res.status})`);
      const data = await res.json();
      return { standings: data.standings, matches: data.matches, updatedAt: data.updatedAt };
    }

    /* ================================================================
       생존팀 계산
       - 조별리그: 각 조 1위·2위 + 3위 중 상위 8팀 진출 (총 32팀)
       - 토너먼트: 매 라운드 패자 탈락
    ================================================================ */
    function calcSurvival(standingsData, allMatches) {
      eliminatedTeams.clear();
      advancedTeams.clear();
      teamRoundPoints.clear();

      const groupStandings = standingsData.standings || [];

      // ── 조별리그 완료된 조 처리 ──
      const thirdPlacers = [];
      groupStandings.forEach(gs => {
        const table = gs.table || [];
        if (!table.length) return;
        const gsGroupKey = gs.group?.replace('Group ', 'GROUP_');

        const groupMatches = allMatches.filter(
          m => m.stage === 'GROUP_STAGE' && m.group === gsGroupKey
        );
        const allFinished = groupMatches.length > 0 &&
          groupMatches.every(m => m.status === 'FINISHED');

        if (allFinished) {
          if (table[0]) { const k=toKo(table[0].team); advancedTeams.add(k); addPoints(k, 1); }
          if (table[1]) { const k=toKo(table[1].team); advancedTeams.add(k); addPoints(k, 1); }
          if (table[2]) thirdPlacers.push({
            name: toKo(table[2].team),
            points: table[2].points,
            gd: table[2].goalDifference,
            gf: table[2].goalsFor
          });
          if (table[3]) eliminatedTeams.add(toKo(table[3].team));
        }
      });

      // 3위 중 상위 8팀 진출 (12개 조 모두 완료됐을 때)
      if (thirdPlacers.length === 12) {
        thirdPlacers.sort((a,b) =>
          b.points - a.points || b.gd - a.gd || b.gf - a.gf
        );
        thirdPlacers.slice(0, 8).forEach(t => { advancedTeams.add(t.name); addPoints(t.name, 1); });
        thirdPlacers.slice(8).forEach(t => eliminatedTeams.add(t.name));
      }

      // ── 토너먼트 단계 처리 (단계별 진출 점수) ──
      // LAST_32 통과 → 16강 진출 +2 / LAST_16 통과 → 8강 진출 +3 / QUARTER_FINALS 통과 → 4강 진출 +4
      const KO_POINTS = { LAST_32: 2, LAST_16: 3, QUARTER_FINALS: 4 };
      const KO_STAGES = ['LAST_32','LAST_16','QUARTER_FINALS','SEMI_FINALS','FINAL'];
      KO_STAGES.forEach(stage => {
        allMatches
          .filter(m => m.stage === stage && m.status === 'FINISHED')
          .forEach(m => {
            const hs = m.score?.fullTime?.home ?? 0;
            const as = m.score?.fullTime?.away ?? 0;
            const homeTeam = toKo(m.homeTeam);
            const awayTeam = toKo(m.awayTeam);
            const pts = KO_POINTS[stage] || 0;
            if (hs > as) {
              eliminatedTeams.add(awayTeam);
              advancedTeams.add(homeTeam);
              if (pts) addPoints(homeTeam, pts);
            }
            if (as > hs) {
              eliminatedTeams.add(homeTeam);
              advancedTeams.add(awayTeam);
              if (pts) addPoints(awayTeam, pts);
            }
          });
      });
    }

    function getParticipantScore(p) {
      let score = 0;
      p.groups.forEach(gid => {
        const g = GROUPS.find(g => g.id === gid);
        if (!g) return;
        g.teams.forEach(t => { score += teamRoundPoints.get(t) || 0; });
      });
      return score;
    }

    /* ================================================================
       API 데이터로 그룹 화면 업데이트
    ================================================================ */
    function applyAPIData(standingsData, matchesData) {
      const groupStandings = standingsData.standings || [];
      const allMatches     = matchesData.matches || [];

      // groups 업데이트 (순위표 + 결과)
      groupStandings.forEach(gs => {
        const letter = gs.group?.replace('Group ', '');
        const groupEl = document.getElementById(`gc-${letter}`);
        if (!groupEl) return;

        // 순위표 tbody 업데이트
        const tbody = groupEl.querySelector('.standings-table tbody');
        if (tbody && gs.table?.length) {
          tbody.innerHTML = gs.table.map((row, i) => `
            <tr>
              <td>${i+1} ${toKo(row.team)}</td>
              <td>${row.playedGames}</td>
              <td>${row.won}</td>
              <td>${row.draw}</td>
              <td>${row.lost}</td>
              <td>${row.goalDifference > 0 ? '+' + row.goalDifference : row.goalDifference}</td>
              <td><b>${row.points}</b></td>
            </tr>`).join('');
        }

        // 경기 결과 업데이트 (matches는 GROUP_A 형식, standings는 Group A 형식)
        const groupMatches = allMatches.filter(
          m => m.stage === 'GROUP_STAGE' && m.group === `GROUP_${letter}`
        );
        const matchesGrid = groupEl.querySelector('.matches-grid');
        if (matchesGrid && groupMatches.length) {
          const col1 = groupMatches.slice(0, 3);
          const col2 = groupMatches.slice(3);
          const renderMatch = m => {
            const s = m.status;
            const h = m.score?.fullTime?.home;
            const a = m.score?.fullTime?.away;
            let scoreHtml;
            if (s === 'FINISHED') {
              scoreHtml = `<span class="score-box">${h} - ${a}</span>`;
            } else if (s === 'IN_PLAY' || s === 'PAUSED') {
              const ch = m.score?.currentPeriod?.home ?? '?';
              const ca = m.score?.currentPeriod?.away ?? '?';
              scoreHtml = `<span class="score-box live">${ch} - ${ca} 🔴</span>`;
            } else {
              scoreHtml = `<span class="score-box">-</span>`;
            }
            const kst = fmtKST(m.utcDate);
            const home = toKo(m.homeTeam);
            const away = toKo(m.awayTeam);
            return `<div class="match-single">
              <div class="match-date-time">${kst} KST</div>
              <div class="match-teams">
                <span class="team-name-sm home">${home}</span>
                ${scoreHtml}
                <span class="team-name-sm away">${away}</span>
              </div>
            </div>`;
          };
          matchesGrid.innerHTML = `
            <div class="match-group">${col1.map(renderMatch).join('')}</div>
            <div class="match-group">${col2.map(renderMatch).join('')}</div>`;
        }
      });

      // 생존팀 계산 후 참가자 카드 업데이트
      buildGroupTeamMap(standingsData);
      calcSurvival(standingsData, allMatches);
      renderParticipants();
      renderTournament(allMatches);
    }

    /* ================================================================
       메인 로드 함수
    ================================================================ */
    async function loadData() {
      if (refreshTimer) clearTimeout(refreshTimer);

      try {
        setStatusBar('loading', '데이터 불러오는 중…');
        const { standings, matches, updatedAt } = await fetchFromAPI();
        const allMatches = matches.matches || [];

        applyAPIData(standings, matches);

        const live = hasLiveMatch(allMatches);
        const today = hasMatchToday(allMatches);
        const interval = getRefreshInterval(allMatches);
        const nextStr = live ? '1분' : today ? '5분' : '1시간';
        const dataKst = updatedAt
          ? new Date(updatedAt).toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul' })
          : new Date().toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul' });

        setStatusBar(live ? 'live' : 'ok',
          `${live ? '🔴 라이브 ' : ''}데이터 기준: ${dataKst} KST · ${nextStr}마다 갱신`);

        refreshTimer = setTimeout(loadData, interval);

      } catch (err) {
        console.error(err);
        setStatusBar('error', `⚠️ 데이터 로드 오류: ${err.message} · 5분 후 재시도`);
        refreshTimer = setTimeout(loadData, 5 * 60 * 1000);
      }
    }

    function renderGroups() {
      const html = GROUPS.map(g=>{
        const pickerIdx = PARTICIPANTS.map((p,i)=>p.groups.includes(g.id)?i:-1).filter(i=>i>=0);
        const badges = pickerIdx.map(i=>{
          const ci = PARTICIPANTS[i].colorIdx ?? i;
          return `<span class="picker-badge p${ci}">${PARTICIPANTS[i].name}</span>`;
        }).join('');
        const matchesCol1 = g.matches.slice(0,3);
        const matchesCol2 = g.matches.slice(3);
        const renderMatches = list => list.map(m=>`
          <div class="match-single">
            <div class="match-date-time">${m.date} KST</div>
            <div class="match-teams">
              <span class="team-name-sm home">${m.home}</span>
              <span class="score-box">-</span>
              <span class="team-name-sm away">${m.away}</span>
            </div>
          </div>`).join('');
        return `<div class="group-card" id="gc-${g.id}">
          <div class="group-header" onclick="toggleGroup('${g.id}')">
            <span class="group-label">${g.id}조</span>
            <span class="group-teams">${g.teams.join(' · ')}</span>
            ${badges?`<div class="group-pickers">${badges}</div>`:''}
            <span style="color:var(--gold);">▼</span>
          </div>
          <div class="group-matches">
            <div class="standings-wrapper">
              <div class="standings-title">📊 조별 순위</div>
              <table class="standings-table">
                <thead><tr><th>팀</th><th>경기</th><th>승</th><th>무</th><th>패</th><th>득실</th><th>승점</th></tr></thead>
                <tbody>
                  ${g.teams.map((t,i)=>`<tr><td>${i+1} ${t}</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td><b>-</b></td></tr>`).join('')}
                </tbody>
              </table>
            </div>
            <span class="matches-label">⚽ 경기 일정</span>
            <div class="matches-grid">
              <div class="match-group">${renderMatches(matchesCol1)}</div>
              <div class="match-group">${renderMatches(matchesCol2)}</div>
            </div>
          </div>
        </div>`;
      }).join('');
      document.getElementById('group-grid').innerHTML = html;
    }

    /* ================================================================
       생존팀 추적
       - eliminatedTeams: 탈락이 확정된 팀 이름 Set
       - advancedTeams: 조별리그 통과가 확정된 팀 이름 Set
       - 비어있으면 아직 시작 전 → 모든 팀 pending 상태
       API 연동 시 이 두 Set을 채워주면 자동으로 반영됨
    ================================================================ */
    const eliminatedTeams  = new Set();
    const advancedTeams    = new Set();
    const teamRoundPoints  = new Map(); // teamName → 누적 점수

    function addPoints(teamName, pts) {
      teamRoundPoints.set(teamName, (teamRoundPoints.get(teamName) || 0) + pts);
    }

    function getTeamStatus(teamName) {
      if (eliminatedTeams.has(teamName)) return 'eliminated';
      if (advancedTeams.has(teamName))   return 'alive';
      return 'pending'; // 아직 미결정
    }

    function renderParticipants() {
      const html = PARTICIPANTS.map(p => {
        // 각 조에서 생존 중인 팀 수 계산
        let aliveCount = 0, totalCount = 0;
        p.groups.forEach(gid => {
          const g = GROUPS.find(g => g.id === gid);
          if (!g) return;
          g.teams.forEach(t => {
            totalCount++;
            if (getTeamStatus(t) !== 'eliminated') aliveCount++;
          });
        });

        const groupSections = p.groups.map(gid => {
          const g = GROUPS.find(g => g.id === gid);
          if (!g) return '';
          const ci = p.colorIdx ?? PARTICIPANTS.indexOf(p);
          const chips = g.teams.map(t => {
            const status = getTeamStatus(t);
            return `<span class="team-chip ${status}">${t}</span>`;
          }).join('');
          return `
            <div class="participant-group-section">
              <div class="participant-group-label" style="color:${COLOR_HEX[ci]}">📌 ${gid}조</div>
              <div class="team-chips">${chips}</div>
            </div>`;
        }).join('');

        const showStats = eliminatedTeams.size > 0 || advancedTeams.size > 0;
        const score = getParticipantScore(p);
        const scoreHtml = showStats
          ? `<span class="participant-score">${score}점</span>`
          : '';
        const countHtml = showStats
          ? `<div class="participant-alive-count">생존 <span>${aliveCount}</span> / ${totalCount}팀</div>`
          : '';

        return `<div class="participant-card">
          <div class="participant-header">
            <div class="participant-name" style="color:${COLOR_HEX[p.colorIdx ?? PARTICIPANTS.indexOf(p)]}">${p.name}${scoreHtml}</div>
            ${countHtml}
          </div>
          ${groupSections}
        </div>`;
      }).join('');
      document.getElementById('participants-grid').innerHTML = html;
    }

    function openResetModal() {
      document.getElementById('reset-pw').value = '';
      document.getElementById('reset-error').textContent = '';
      document.getElementById('reset-pw').classList.remove('error');
      document.getElementById('reset-modal').classList.add('open');
      setTimeout(() => document.getElementById('reset-pw').focus(), 50);
    }

    function closeResetModal() {
      document.getElementById('reset-modal').classList.remove('open');
    }

    function handleOverlayClick(e) {
      if (e.target === document.getElementById('reset-modal')) closeResetModal();
    }

    function handlePwKey(e) {
      if (e.key === 'Enter') confirmReset();
      if (e.key === 'Escape') closeResetModal();
    }

    function confirmReset() {
      const pw = document.getElementById('reset-pw').value;
      const input = document.getElementById('reset-pw');
      const errEl = document.getElementById('reset-error');
      if (pw !== '7967') {
        errEl.textContent = '비밀번호가 올바르지 않습니다.';
        input.classList.add('error');
        input.value = '';
        setTimeout(() => input.classList.remove('error'), 400);
        return;
      }
      closeResetModal();
      window.location.href = 'draft.html';
    }

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const resp = await fetch('draft-result.json?_=' + Date.now());
        if (resp.ok) {
          const data = await resp.json();
          PARTICIPANTS = data.participants || [];
        }
      } catch(e) {}
      if (!PARTICIPANTS.length) {
        document.getElementById('participants-grid').innerHTML =
          `<div style="grid-column:1/-1;padding:40px;text-align:center;color:var(--muted);font-family:'IBM Plex Mono',monospace;">
             드래프트를 먼저 진행해주세요.
             <br/><br/>
             <a href="draft.html" style="color:var(--gold);font-size:0.9rem;">→ 드래프트 시작하기</a>
           </div>`;
      }
      renderGroups();
      renderParticipants();
      renderTournament([]);
      loadData();
    });
  </script>
</body>
